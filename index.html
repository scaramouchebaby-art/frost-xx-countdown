<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <title>[XX] — [F.R.O.S.T.]</title>

  <style>
    :root {
      --bg: #090909;
      --paper: #d7d3c9;
      --muted: #8e8b84;
      --red: #7d1616;
      --line: rgba(215,211,201,.25);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: var(--bg);
      color: var(--paper);
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family: Georgia, "Times New Roman", serif;
      position: relative;
      isolation: isolate;
    }

    /* Бумажная/плёночная фактура без внешних файлов */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -3;
      opacity: .55;
      background:
        radial-gradient(ellipse at 12% 18%, rgba(255,255,255,.09), transparent 22%),
        radial-gradient(ellipse at 87% 72%, rgba(255,255,255,.06), transparent 24%),
        repeating-linear-gradient(
          0deg,
          rgba(255,255,255,.018) 0,
          rgba(255,255,255,.018) 1px,
          transparent 1px,
          transparent 4px
        ),
        #090909;
    }

    body::after {
      content: "";
      position: fixed;
      inset: -20%;
      z-index: -2;
      pointer-events: none;
      opacity: .34;
      background:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,.15) 0 1px, transparent 1.5px),
        radial-gradient(circle at 70% 60%, rgba(255,255,255,.12) 0 1px, transparent 1.5px),
        radial-gradient(circle at 40% 80%, rgba(255,255,255,.10) 0 1px, transparent 1.5px);
      background-size: 17px 19px, 23px 21px, 29px 27px;
      transform: rotate(-2deg);
    }

    .red-stain {
      position: fixed;
      z-index: -1;
      width: 180px;
      height: 240px;
      opacity: .6;
      filter: blur(1px);
      background:
        radial-gradient(ellipse at 30% 30%, rgba(125,22,22,.9), transparent 42%),
        radial-gradient(ellipse at 65% 60%, rgba(125,22,22,.65), transparent 38%),
        radial-gradient(ellipse at 40% 85%, rgba(125,22,22,.5), transparent 30%);
      transform: rotate(-18deg);
    }

    .stain-left { left: -70px; top: 12%; }
    .stain-right { right: -80px; bottom: 8%; transform: rotate(22deg); }

    .wrapper {
      min-height: 100vh;
      width: min(920px, 100%);
      margin: 0 auto;
      padding: max(34px, env(safe-area-inset-top) + 24px) 22px
               max(38px, env(safe-area-inset-bottom) + 28px);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .poster {
      width: 100%;
      max-width: 820px;
      min-height: 720px;
      padding: clamp(28px, 7vw, 68px) clamp(20px, 7vw, 70px);
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      overflow: hidden;
      border: 1px solid rgba(215,211,201,.15);
      box-shadow: 0 0 80px rgba(0,0,0,.65);
      background:
        linear-gradient(rgba(0,0,0,.18), rgba(0,0,0,.28)),
        repeating-linear-gradient(
          103deg,
          transparent 0 42px,
          rgba(255,255,255,.025) 43px,
          transparent 45px
        ),
        #0a0a0a;
    }

    /* Рваные бумажные края */
    .poster::before,
    .poster::after {
      content: "";
      position: absolute;
      pointer-events: none;
      opacity: .35;
    }

    .poster::before {
      inset: 0 auto 0 0;
      width: 13%;
      background:
        linear-gradient(90deg, rgba(210,205,192,.18), transparent),
        repeating-linear-gradient(
          170deg,
          transparent 0 18px,
          rgba(210,205,192,.12) 19px,
          transparent 22px
        );
      clip-path: polygon(0 0, 76% 4%, 60% 11%, 82% 19%, 57% 28%, 80% 39%, 52% 49%, 78% 62%, 55% 72%, 83% 84%, 62% 94%, 78% 100%, 0 100%);
    }

    .poster::after {
      inset: auto 0 0 auto;
      width: 25%;
      height: 35%;
      background:
        radial-gradient(ellipse at 60% 70%, rgba(210,205,192,.14), transparent 42%),
        repeating-linear-gradient(164deg, transparent 0 11px, rgba(210,205,192,.09) 12px, transparent 14px);
      clip-path: polygon(22% 0,100% 8%,100% 100%,0 100%,15% 82%,6% 65%,24% 47%,9% 28%);
    }

    .topline {
      font-size: clamp(11px, 2.3vw, 16px);
      letter-spacing: .42em;
      margin-left: .42em;
      color: var(--paper);
      opacity: .82;
      text-transform: uppercase;
      text-shadow: 1px 1px 0 #000;
    }

    .title {
      margin: clamp(38px, 7vw, 68px) 0 28px;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", Georgia, serif;
      font-size: clamp(86px, 23vw, 230px);
      line-height: .72;
      letter-spacing: .06em;
      margin-left: .06em;
      font-weight: 900;
      color: #d9d5ca;
      text-shadow:
        3px 3px 0 #3a3935,
        -1px -1px 0 rgba(255,255,255,.15);
      filter: contrast(1.15);
    }

    .release-label {
      margin-top: 18px;
      font-size: clamp(13px, 3vw, 20px);
      letter-spacing: .42em;
      margin-left: .42em;
      color: var(--paper);
      text-transform: uppercase;
    }

    .timer {
      margin: 30px auto 0;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(7px, 2vw, 18px);
    }

    .unit {
      position: relative;
      padding: 14px 4px 10px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid rgba(215,211,201,.13);
    }

    .number {
      display: block;
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(30px, 7.5vw, 76px);
      line-height: 1;
      font-weight: 700;
      letter-spacing: -.07em;
      color: #e2ded3;
      text-shadow: 2px 2px 0 #202020;
    }

    .caption {
      display: block;
      margin-top: 9px;
      font-size: clamp(8px, 1.8vw, 12px);
      letter-spacing: .25em;
      margin-left: .25em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .date {
      margin-top: 34px;
      font-family: "Courier New", monospace;
      font-size: clamp(10px, 2.2vw, 15px);
      letter-spacing: .2em;
      color: #aaa69e;
    }

    .date small {
      display: block;
      margin-top: 8px;
      font-family: Georgia, serif;
      font-size: .78em;
      letter-spacing: .28em;
      opacity: .7;
    }

    .bottom-line {
      margin-top: 42px;
      font-size: 10px;
      letter-spacing: .36em;
      margin-left: .36em;
      color: #696760;
      text-transform: uppercase;
    }

    .done {
      margin-top: 32px;
      font-size: clamp(23px, 6vw, 54px);
      letter-spacing: .12em;
      margin-left: .12em;
      font-weight: bold;
      color: var(--paper);
      text-transform: uppercase;
    }

    @media (max-width: 520px) {
      .poster {
        min-height: calc(100vh - 48px);
        border-left: 0;
        border-right: 0;
      }

      .timer { gap: 4px; }
      .number { font-size: clamp(25px, 9vw, 44px); }
      .caption { letter-spacing: .13em; margin-left: .13em; }
      .bottom-line { margin-top: 30px; }
    }

    @media (prefers-reduced-motion: no-preference) {
      .number {
        transition: opacity .15s ease;
      }
    }
  </style>
</head>

<body>
  <div class="red-stain stain-left"></div>
  <div class="red-stain stain-right"></div>

  <main class="wrapper">
    <section class="poster" aria-label="Обратный отсчёт до релиза [XX]">

      <div class="topline">[F.R.O.S.T.]</div>

      <div class="title">[XX]</div>

      <div id="countdown">
        <div class="release-label">До релиза</div>

        <div class="timer">
          <div class="unit">
            <span class="number" id="days">00</span>
            <span class="caption">Дней</span>
          </div>

          <div class="unit">
            <span class="number" id="hours">00</span>
            <span class="caption">Часов</span>
          </div>

          <div class="unit">
            <span class="number" id="minutes">00</span>
            <span class="caption">Минут</span>
          </div>

          <div class="unit">
            <span class="number" id="seconds">00</span>
            <span class="caption">Секунд</span>
          </div>
        </div>

        <div class="date">
          01.01.2027&nbsp;&nbsp;00:01
          <small>Екатеринбург · UTC+5</small>
        </div>
      </div>

      <div class="bottom-line">by FrostBandMusic</div>
    </section>
  </main>

  <script>
    /*
      Дата релиза:
      01 января 2027, 00:01:00
      Екатеринбург = UTC+5

      ISO-строка с явным +05:00 не зависит
      от часового пояса телефона пользователя.
    */
    const RELEASE_TIME = new Date("2027-01-01T00:01:00+05:00").getTime();

    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");
    const countdownEl = document.getElementById("countdown");

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function updateCountdown() {
      const difference = RELEASE_TIME - Date.now();

      if (difference <= 0) {
        countdownEl.innerHTML = `
          <div class="done">[XX] уже вышел</div>
          <div class="date">
            01.01.2027&nbsp;&nbsp;00:01
            <small>Екатеринбург · UTC+5</small>
          </div>
        `;
        return;
      }

      const totalSeconds = Math.floor(difference / 1000);

      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      daysEl.textContent = pad(days);
      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
  </script>
</body>
</html>
