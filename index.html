<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <title>[XX] — [F.R.O.S.T.]</title>

  <style>
    :root {
      --black: #070707;
      --charcoal: #11110f;
      --paper: #d6d1c5;
      --paper-dim: #918d84;
      --red: #711818;
      --red-dark: #3f0d0d;
      --white: #e6e1d5;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-width: 100%;
      min-height: 100%;
      background: var(--black);
      color: var(--paper);
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      font-family: Georgia, "Times New Roman", serif;
      position: relative;
      isolation: isolate;
    }

    /* Грубая старая бумага + фотоплёнка */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      z-index: -8;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 14% 16%, rgba(255,255,255,.07), transparent 24%),
        radial-gradient(ellipse at 84% 78%, rgba(255,255,255,.045), transparent 25%),
        linear-gradient(115deg, transparent 0 37%, rgba(255,255,255,.025) 37.2%, transparent 38%),
        repeating-linear-gradient(0deg,
          rgba(255,255,255,.018) 0 1px,
          transparent 1px 4px),
        #070707;
      opacity: .95;
    }

    body::after {
      content: "";
      position: fixed;
      inset: -30%;
      z-index: -7;
      pointer-events: none;
      opacity: .28;
      background-image:
        radial-gradient(circle, rgba(255,255,255,.24) 0 0.7px, transparent .9px),
        radial-gradient(circle, rgba(255,255,255,.12) 0 .7px, transparent .9px);
      background-size: 13px 17px, 23px 19px;
      background-position: 0 0, 7px 11px;
      transform: rotate(-4deg);
    }

    .wrapper {
      min-height: 100vh;
      width: 100%;
      padding: max(20px, env(safe-area-inset-top))
               max(14px, env(safe-area-inset-right))
               max(24px, env(safe-area-inset-bottom))
               max(14px, env(safe-area-inset-left));
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .poster {
      width: min(920px, 100%);
      min-height: min(860px, calc(100vh - 40px));
      position: relative;
      overflow: hidden;
      padding: clamp(28px, 6vw, 62px) clamp(20px, 7vw, 74px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      background:
        linear-gradient(rgba(0,0,0,.18), rgba(0,0,0,.36)),
        repeating-linear-gradient(113deg,
          transparent 0 51px,
          rgba(255,255,255,.018) 52px,
          transparent 54px),
        #0b0b0a;
      border: 1px solid rgba(214,209,197,.13);
      box-shadow:
        0 35px 100px rgba(0,0,0,.8),
        inset 0 0 80px rgba(0,0,0,.72);
    }

    /* Неровные края старого листа */
    .poster::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .55;
      background:
        linear-gradient(90deg, rgba(218,213,202,.16), transparent 3% 97%, rgba(218,213,202,.08)),
        linear-gradient(0deg, rgba(218,213,202,.11), transparent 2% 97%, rgba(218,213,202,.08));
      clip-path: polygon(
        0 1%, 4% 0, 9% 1%, 16% 0, 24% 1%, 31% 0, 41% 1%, 51% 0,
        61% 1%, 70% 0, 79% 1%, 88% 0, 96% 2%, 100% 1%,
        99% 10%, 100% 20%, 99% 31%, 100% 42%, 99% 54%, 100% 65%,
        99% 77%, 100% 89%, 98% 100%, 89% 99%, 80% 100%, 69% 99%,
        59% 100%, 49% 99%, 39% 100%, 29% 99%, 19% 100%, 9% 99%, 1% 100%,
        0 90%, 1% 79%, 0 67%, 1% 55%, 0 44%, 1% 32%, 0 20%
      );
    }

    /* Красные чернильные пятна */
    .red-stain {
      position: fixed;
      z-index: -2;
      pointer-events: none;
      mix-blend-mode: screen;
      filter: blur(2px);
      opacity: .52;
    }

    .stain-left {
      width: 250px;
      height: 330px;
      left: -95px;
      top: 4%;
      transform: rotate(-19deg);
      background:
        radial-gradient(ellipse at 42% 30%, rgba(113,24,24,.85), transparent 37%),
        radial-gradient(ellipse at 60% 57%, rgba(113,24,24,.65), transparent 39%),
        radial-gradient(ellipse at 34% 84%, rgba(113,24,24,.52), transparent 30%);
    }

    .stain-right {
      width: 290px;
      height: 250px;
      right: -110px;
      bottom: 4%;
      transform: rotate(24deg);
      background:
        radial-gradient(ellipse at 55% 40%, rgba(113,24,24,.72), transparent 38%),
        radial-gradient(ellipse at 30% 72%, rgba(113,24,24,.55), transparent 32%);
    }

    /* Силуэт ворона */
    .poster .raven {
      position: absolute;
      right: 7%;
      top: 13%;
      width: 110px;
      height: 42px;
      opacity: .32;
      transform: rotate(-7deg);
      filter: blur(.2px);
    }

    .poster .raven::before,
    .poster .raven::after {
      content: "";
      position: absolute;
      background: #000;
    }

    .poster .raven::before {
      width: 74px;
      height: 18px;
      left: 18px;
      top: 13px;
      border-radius: 80% 15% 80% 20%;
      transform: rotate(-8deg);
      box-shadow: 20px 5px 0 -4px #000;
    }

    .poster .raven::after {
      width: 30px;
      height: 12px;
      left: 69px;
      top: 5px;
      clip-path: polygon(0 50%, 100% 0, 67% 100%);
    }

    .topline {
      position: relative;
      z-index: 2;
      font-size: clamp(10px, 2vw, 15px);
      letter-spacing: .48em;
      margin-left: .48em;
      color: var(--paper);
      opacity: .82;
      text-transform: uppercase;
      text-shadow: 1px 1px #000;
    }

    .title {
      position: relative;
      z-index: 2;
      margin: clamp(45px, 8vw, 76px) 0 26px;
      font-family: Impact, Haettenschweiler, "Arial Narrow Bold", Georgia, serif;
      font-size: clamp(84px, 22vw, 225px);
      line-height: .7;
      letter-spacing: .065em;
      margin-left: .065em;
      font-weight: 900;
      color: var(--white);
      text-shadow:
        2px 2px 0 #35342f,
        -1px -1px 0 rgba(255,255,255,.14);
      filter: contrast(1.2);
    }

    /* Имитация потёртостей прямо на крупной надписи */
    .title::after {
      content: "";
      position: absolute;
      inset: 25% 4% 18%;
      pointer-events: none;
      background: repeating-linear-gradient(
        -7deg,
        transparent 0 13px,
        rgba(0,0,0,.22) 14px 16px,
        transparent 17px 31px
      );
      mix-blend-mode: multiply;
    }

    .release-label {
      position: relative;
      z-index: 2;
      margin-top: 22px;
      font-size: clamp(12px, 2.8vw, 19px);
      letter-spacing: .43em;
      margin-left: .43em;
      color: var(--paper);
      text-transform: uppercase;
    }

    .timer {
      position: relative;
      z-index: 2;
      margin: 28px auto 0;
      width: 100%;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: clamp(5px, 2vw, 17px);
    }

    .unit {
      padding: 14px 3px 11px;
      border-top: 1px solid rgba(214,209,197,.3);
      border-bottom: 1px solid rgba(214,209,197,.13);
      background: linear-gradient(rgba(255,255,255,.012), rgba(0,0,0,.1));
    }

    .number {
      display: block;
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(28px, 7.2vw, 70px);
      line-height: 1;
      font-weight: 700;
      letter-spacing: -.08em;
      color: var(--white);
      text-shadow: 2px 2px 0 #1b1b1a;
    }

    .caption {
      display: block;
      margin-top: 9px;
      font-size: clamp(7px, 1.6vw, 11px);
      letter-spacing: .25em;
      margin-left: .25em;
      color: var(--paper-dim);
      text-transform: uppercase;
    }

    .date {
      position: relative;
      z-index: 2;
      margin-top: 31px;
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(9px, 2vw, 14px);
      letter-spacing: .2em;
      color: #aaa69d;
    }

    .date small {
      display: block;
      margin-top: 8px;
      font-family: Georgia, "Times New Roman", serif;
      font-size: .8em;
      letter-spacing: .3em;
      opacity: .67;
    }

    .bottom-line {
      position: relative;
      z-index: 2;
      margin-top: 43px;
      font-size: clamp(9px, 1.7vw, 11px);
      letter-spacing: .34em;
      margin-left: .34em;
      color: #77736b;
      text-transform: uppercase;
    }

    /* Тонкая линия горизонта/моря */
    .sea {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 15%;
      opacity: .22;
      pointer-events: none;
      background:
        repeating-linear-gradient(
          -5deg,
          transparent 0 10px,
          rgba(214,209,197,.22) 11px,
          transparent 12px 19px
        );
      mask-image: linear-gradient(to top, black, transparent);
    }

    .done {
      position: relative;
      z-index: 2;
      margin-top: 30px;
      font-size: clamp(22px, 6vw, 52px);
      letter-spacing: .12em;
      margin-left: .12em;
      font-weight: bold;
      color: var(--paper);
      text-transform: uppercase;
    }

    @media (max-width: 520px) {
      .poster {
        min-height: calc(100vh - 40px);
        padding-left: 16px;
        padding-right: 16px;
      }

      .timer { gap: 3px; }
      .number { font-size: clamp(24px, 9vw, 44px); }
      .caption {
        font-size: 7px;
        letter-spacing: .11em;
        margin-left: .11em;
      }
      .bottom-line {
        margin-top: 30px;
        letter-spacing: .25em;
        margin-left: .25em;
      }
      .poster .raven {
        right: 2%;
        top: 12%;
        transform: scale(.72) rotate(-7deg);
      }
    }

    @media (prefers-reduced-motion: no-preference) {
      .number { transition: opacity .15s ease; }
    }
  </style>
  <!-- VK Mini Apps compatibility -->
  <script>
    (function () {
      function initVKBridge() {
        try {
          if (window.vkBridge && typeof window.vkBridge.send === "function") {
            window.vkBridge.send("VKWebAppInit").catch(function () {});
          }
        } catch (e) {}
      }
      var s = document.createElement("script");
      s.src = "https://unpkg.com/@vkontakte/vk-bridge@2/dist/browser.min.js";
      s.async = true;
      s.onload = initVKBridge;
      s.onerror = function () {};
      document.head.appendChild(s);
    })();
  </script>

</head>

<body>
  <div class="red-stain stain-left"></div>
  <div class="red-stain stain-right"></div>

  <main class="wrapper">
    <section class="poster" aria-label="Обратный отсчёт до релиза [XX]">
      <div class="raven" aria-hidden="true"></div>
      <div class="sea" aria-hidden="true"></div>

      <div class="topline">[F.R.O.S.T.]</div>

      <div class="title">[XX]</div>

      <div id="countdown">
        <div class="release-label">До релиза</div>

        <div class="timer">
          <div class="unit">
            <span class="number" id="days">00</span>
            <span class="caption">Дней</span>
          </div>

          <div class="unit">
            <span class="number" id="hours">00</span>
            <span class="caption">Часов</span>
          </div>

          <div class="unit">
            <span class="number" id="minutes">00</span>
            <span class="caption">Минут</span>
          </div>

          <div class="unit">
            <span class="number" id="seconds">00</span>
            <span class="caption">Секунд</span>
          </div>
        </div>

        <div class="date">
          01.01.2027&nbsp;&nbsp;00:01
          <small>Екатеринбург · UTC+5</small>
        </div>
      </div>

      <div class="bottom-line">by FrostBandMusic</div>
    </section>
  </main>

  <script>
    /*
      Дата релиза:
      01 января 2027, 00:01:00
      Екатеринбург = UTC+5

      ISO-строка с явным +05:00 не зависит
      от часового пояса телефона пользователя.
    */
    const RELEASE_TIME = new Date("2027-01-01T00:01:00+05:00").getTime();

    const daysEl = document.getElementById("days");
    const hoursEl = document.getElementById("hours");
    const minutesEl = document.getElementById("minutes");
    const secondsEl = document.getElementById("seconds");
    const countdownEl = document.getElementById("countdown");

    function pad(value) {
      return String(value).padStart(2, "0");
    }

    function updateCountdown() {
      const difference = RELEASE_TIME - Date.now();

      if (difference <= 0) {
        countdownEl.innerHTML = `
          <div class="done">[XX] уже вышел</div>
          <div class="date">
            01.01.2027&nbsp;&nbsp;00:01
            <small>Екатеринбург · UTC+5</small>
          </div>
        `;
        return;
      }

      const totalSeconds = Math.floor(difference / 1000);

      const days = Math.floor(totalSeconds / 86400);
      const hours = Math.floor((totalSeconds % 86400) / 3600);
      const minutes = Math.floor((totalSeconds % 3600) / 60);
      const seconds = totalSeconds % 60;

      daysEl.textContent = pad(days);
      hoursEl.textContent = pad(hours);
      minutesEl.textContent = pad(minutes);
      secondsEl.textContent = pad(seconds);
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);

    document.addEventListener("visibilitychange", function () {
      if (!document.hidden) updateCountdown();
    });
    window.addEventListener("pageshow", updateCountdown);
  </script>
</body>
</html>
